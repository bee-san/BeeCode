name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # The full test suite must pass before anything is published. A release that
  # skipped verification would be worse than no release.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew test --stacktrace

  android:
    name: Android APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      # An unsigned APK cannot be installed at all, so publishing one would ship a
      # file that simply does not work. Fail here instead.
      - name: Verify the APK is signed and complete
        run: |
          set -euo pipefail
          apk=androidApp/build/outputs/apk/release/androidApp-release.apk
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          "$build_tools/apksigner" verify --print-certs "$apk"

          contents=$(unzip -l "$apk")
          for entry in \
            "lib/arm64-v8a/libpython3.12.so" \
            "lib/arm64-v8a/libsqlitejdbc.so" \
            "assets/problems.json"
          do
            grep -q "$entry" <<<"$contents" || { echo "::error::$entry missing"; exit 1; }
            echo "ok: $entry"
          done

      - name: Name the artifact for humans
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/androidApp-release.apk \
             "dist/BeeCode-${{ github.ref_name }}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk

  # jpackage only targets the OS it runs on, so a macOS .dmg genuinely requires a
  # macOS runner. This cannot be cross-built from Linux.
  macos:
    name: macOS DMG
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build DMG
        run: ./gradlew :desktopApp:packageDmg --stacktrace

      - name: Name the artifact for humans
        run: |
          set -euo pipefail
          mkdir -p dist
          dmg=$(find desktopApp/build/compose/binaries -name '*.dmg' | head -1)
          [ -n "$dmg" ] || { echo "::error::no DMG was produced"; exit 1; }
          # macos-latest is arm64, so label it: an Intel Mac needs a separate build.
          cp "$dmg" "dist/BeeCode-${{ github.ref_name }}-macos-arm64.dmg"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg

  linux:
    name: Linux AppImage
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build distributable
        run: ./gradlew :desktopApp:createDistributable --stacktrace

      - name: Archive
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/BeeCode-${{ github.ref_name }}-linux-x64.tar.gz" \
            -C desktopApp/build/compose/binaries/main/app BeeCode

      - uses: actions/upload-artifact@v4
        with:
          name: linux-archive
          path: dist/*.tar.gz

  publish:
    name: Publish release
    needs: [android, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.apk' -o -name '*.dmg' -o -name '*.tar.gz' \) \
            -exec cp {} dist/ \;
          ls -la dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "BeeCode ${{ github.ref_name }}" \
            --notes-file .github/RELEASE_NOTES.md \
            --verify-tag
