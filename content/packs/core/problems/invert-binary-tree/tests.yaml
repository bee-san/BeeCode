# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-perfect-tree
    arguments: [[4, 2, 7, 1, 3, 6, 9]]
    expected: [4, 7, 2, 9, 6, 3, 1]
    comparator: exact

  - name: example-single-left-child
    # The child crosses to the right, which lengthens the level-order list.
    arguments: [[1, 2]]
    expected: [1, null, 2]
    comparator: exact

  - name: empty-tree
    arguments: [[]]
    expected: []
    comparator: exact

  - name: single-node
    arguments: [[1]]
    expected: [1]
    comparator: exact

  - name: single-right-child
    # The mirror of the previous case, and the trailing null must be trimmed.
    arguments: [[1, null, 2]]
    expected: [1, 2]
    comparator: exact
    hidden: true

  - name: three-nodes
    arguments: [[2, 1, 3]]
    expected: [2, 3, 1]
    comparator: exact
    hidden: true

  - name: grandchild-crosses-two-levels
    # Node 4 is the right child of 2 and must end up the left child of 2,
    # which sits at a different index. Swapping only the top level fails.
    arguments: [[1, 2, 3, null, 4]]
    expected: [1, 3, 2, null, null, 4]
    comparator: exact
    hidden: true

  - name: left-leaning-chain
    # A chain inverts into the opposite chain, whose indices grow much faster.
    arguments: [[1, 2, null, 3]]
    expected: [1, null, 2, null, null, null, 3]
    comparator: exact
    hidden: true
