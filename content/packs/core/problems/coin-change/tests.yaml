# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-greedy-would-fail
    arguments: [[1, 3, 4], 6]
    expected: 2
    comparator: exact

  - name: example-impossible
    arguments: [[2], 3]
    expected: -1
    comparator: exact

  - name: zero-amount-needs-no-coins
    arguments: [[1, 2], 0]
    expected: 0
    comparator: exact

  - name: exact-single-coin
    arguments: [[1, 5, 10], 10]
    expected: 1
    comparator: exact

  - name: coin-larger-than-the-amount
    # Without a coin <= total guard, negative indexing reads a bogus
    # subproblem instead of skipping the coin.
    arguments: [[100], 5]
    expected: -1
    comparator: exact

  - name: classic-denominations
    # 25 + 25 + 10 + 1 + 1 + 1.
    arguments: [[1, 5, 10, 25], 63]
    expected: 6
    comparator: exact
    hidden: true

  - name: only-ones
    # The worst case, and the reason amount + 1 is a safe sentinel.
    arguments: [[1], 17]
    expected: 17
    comparator: exact
    hidden: true

  - name: greedy-fails-harder
    # 7 + 7. Greedy takes 10 + 1 + 1 + 1 + 1 and answers 5.
    arguments: [[1, 7, 10], 14]
    expected: 2
    comparator: exact
    hidden: true

  - name: impossible-with-several-coins
    arguments: [[4, 6], 5]
    expected: -1
    comparator: exact
    hidden: true

  - name: large-amount
    # The largest coin is 11, so no answer beats ceil(5000 / 11) = 455 -- and
    # 455 is unreachable, because trimming 455 elevens from 5005 down to 5000
    # means shedding exactly 5, and no swap sheds 5. The answer is 456, e.g.
    # 454 elevens plus 3 plus 3.
    arguments: [[1, 3, 4, 7, 11], 5000]
    expected: 456
    comparator: exact
    hidden: true
