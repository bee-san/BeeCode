# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-second-largest
    arguments: [[3, 2, 1, 5, 6, 4], 2]
    expected: 5
    comparator: exact

  - name: duplicates-count-separately
    arguments: [[3, 3, 1], 2]
    expected: 3
    comparator: exact

  - name: single-element
    arguments: [[7], 1]
    expected: 7
    comparator: exact

  - name: k-is-the-largest
    arguments: [[3, 2, 1, 5, 6, 4], 1]
    expected: 6
    comparator: exact

  - name: k-is-the-smallest
    # k equal to the length must return the minimum, not fail.
    arguments: [[3, 2, 1, 5, 6, 4], 6]
    expected: 1
    comparator: exact

  - name: all-equal
    arguments: [[2, 2, 2, 2], 3]
    expected: 2
    comparator: exact
    hidden: true

  - name: negatives-and-zero
    # Rules out initialising the running answer to 0.
    arguments: [[-1, -5, 0, -3], 2]
    expected: -1
    comparator: exact
    hidden: true

  - name: already-sorted-ascending
    arguments: [[1, 2, 3, 4, 5], 3]
    expected: 3
    comparator: exact
    hidden: true

  - name: duplicates-around-the-boundary
    # Deduplicating would answer 1 instead of 4.
    arguments: [[5, 4, 4, 4, 1], 3]
    expected: 4
    comparator: exact
    hidden: true
