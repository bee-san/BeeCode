# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-valid
    arguments: [[2, 1, 3]]
    expected: true
    comparator: exact

  - name: example-invalid-across-subtrees
    arguments: [[5, 1, 4, null, null, 3, 6]]
    expected: false
    comparator: exact

  - name: empty-tree-is-valid
    arguments: [[]]
    expected: true
    comparator: exact

  - name: root-only-is-valid
    arguments: [[1]]
    expected: true
    comparator: exact

  - name: locally-fine-but-globally-wrong
    # 4 is greater than its parent 6? No: 4 < 6 so the parent check passes,
    # but 4 is in the right subtree of 5 and 4 < 5. A parent-child-only check
    # wrongly accepts this.
    arguments: [[5, 1, 6, null, null, 4, 7]]
    expected: false
    comparator: exact

  - name: duplicates-are-rejected
    # The ordering is strict, so equal values are invalid.
    arguments: [[2, 2]]
    expected: false
    comparator: exact
    hidden: true

  - name: valid-left-chain
    arguments: [[3, 2, null, 1]]
    expected: true
    comparator: exact
    hidden: true

  - name: negatives-and-zero
    # Rules out a sentinel bound of 0 or a falsiness check.
    arguments: [[0, -2, 3, -3, -1]]
    expected: true
    comparator: exact
    hidden: true

  - name: invalid-deep-on-the-left
    # 9 is in the left subtree of 8. Only an interval that is carried down
    # catches it.
    arguments: [[8, 4, 12, 2, 9]]
    expected: false
    comparator: exact
    hidden: true
