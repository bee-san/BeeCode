# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-shared-prefixes
    arguments: [["apple", "app", "apricot"], ["ap", "app", "b"]]
    expected: [3, 2, 0]
    comparator: exact

  - name: duplicates-count-separately
    arguments: [["a", "a"], ["a"]]
    expected: [2]
    comparator: exact

  - name: no-words
    arguments: [[], ["a", "b"]]
    expected: [0, 0]
    comparator: exact

  - name: no-queries
    arguments: [["apple"], []]
    expected: []
    comparator: exact

  - name: a-word-is-its-own-prefix
    # The full word must count, not just strict prefixes.
    arguments: [["apple"], ["apple"]]
    expected: [1]
    comparator: exact

  - name: query-longer-than-every-word
    # The walk runs off the end of the trie and must report 0, not the count
    # at the last node it reached.
    arguments: [["app"], ["apple"]]
    expected: [0]
    comparator: exact
    hidden: true

  - name: passing-through-is-not-ending-here
    # Counting only exact word-ends would answer 1.
    arguments: [["ab", "abc", "abcd"], ["abc"]]
    expected: [2]
    comparator: exact
    hidden: true

  - name: results-follow-query-order
    # One entry per query, in order, including a repeat.
    arguments: [["zebra", "apple"], ["z", "a", "z"]]
    expected: [1, 1, 1]
    comparator: exact
    hidden: true

