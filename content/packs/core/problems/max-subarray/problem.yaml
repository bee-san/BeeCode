# Schema version of this authoring format. Bumped when the loader's expectations
# change, so an old Problem folder fails loudly rather than being misread.
schemaVersion: 1

title: Maximum Subarray Sum
difficulty: medium
topics:
  - arrays
  - dynamic-programming

# The function BeeCode calls to test the solution. Must match starter.py and
# reference.py.
entryPoint: max_subarray_sum

# Worked examples shown with the statement. These are illustrative only; judging
# uses tests.yaml.
examples:
  - input: "nums = [-2, 1, -3, 4, -1, 2, 1, -5, 4]"
    output: "6"
    explanation: "The subarray [4, -1, 2, 1] sums to 6, and nothing beats it."
  - input: "nums = [-3, -1, -2]"
    output: "-1"
    explanation: >
      Every value is negative, so the best you can do is the single largest
      element. The answer is not 0 — an empty subarray is not allowed.

