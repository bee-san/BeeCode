# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-one-repeat
    # Six subsets, not eight.
    arguments: [[1, 2, 2]]
    expected: [[], [1], [1, 2], [1, 2, 2], [2], [2, 2]]
    comparator: unordered_list

  - name: example-single-zero
    arguments: [[0]]
    expected: [[], [0]]
    comparator: unordered_list

  - name: empty-list
    # The power set of nothing holds the empty subset, not nothing.
    arguments: [[]]
    expected: [[]]
    comparator: unordered_list

  - name: two-identical-values
    # Three subsets. Both the missing skip and an over-eager skip get this
    # wrong.
    arguments: [[1, 1]]
    expected: [[], [1], [1, 1]]
    comparator: unordered_list

  - name: all-distinct
    # With no repeats the answer is the full power set.
    arguments: [[1, 2, 3]]
    expected: [[], [1], [2], [3], [1, 2], [1, 3], [2, 3], [1, 2, 3]]
    comparator: unordered_list
    hidden: true

  - name: three-identical-values
    arguments: [[4, 4, 4]]
    expected: [[], [4], [4, 4], [4, 4, 4]]
    comparator: unordered_list
    hidden: true

  - name: unsorted-with-repeats
    # Equal values are not adjacent on input, so sorting is not optional.
    arguments: [[2, 1, 2]]
    expected: [[], [1], [1, 2], [1, 2, 2], [2], [2, 2]]
    comparator: unordered_list
    hidden: true

  - name: negatives-and-zero
    # Rules out a falsiness test standing in for membership.
    arguments: [[0, -1, -1]]
    expected: [[], [-1], [-1, -1], [-1, 0], [-1, -1, 0], [0]]
    comparator: unordered_list
    hidden: true

  - name: two-pairs
    # Nine subsets: 3 * 3, against 16 for the full power set.
    arguments: [[1, 1, 2, 2]]
    expected: [[], [1], [1, 1], [2], [2, 2], [1, 2], [1, 1, 2], [1, 2, 2], [1, 1, 2, 2]]
    comparator: unordered_list
    hidden: true
