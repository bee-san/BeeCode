# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-two-rooms
    arguments: [[[0, 30], [5, 10], [15, 20]]]
    expected: 2
    comparator: exact

  - name: example-one-room
    arguments: [[[7, 10], [2, 4]]]
    expected: 1
    comparator: exact

  - name: no-meetings
    arguments: [[]]
    expected: 0
    comparator: exact

  - name: back-to-back-reuses-the-room
    # A strict release comparison answers 2 here.
    arguments: [[[1, 2], [2, 3]]]
    expected: 1
    comparator: exact

  - name: a-single-meeting
    arguments: [[[5, 10]]]
    expected: 1
    comparator: exact
    hidden: true

  - name: three-identical-meetings
    arguments: [[[1, 5], [1, 5], [1, 5]]]
    expected: 3
    comparator: exact
    hidden: true

  - name: depth-is-not-coverage
    # Merging gives one interval, but two meetings run at once.
    arguments: [[[1, 10], [2, 3], [4, 5]]]
    expected: 2
    comparator: exact
    hidden: true

  - name: a-staircase-of-overlaps
    arguments: [[[1, 4], [2, 5], [3, 6]]]
    expected: 3
    comparator: exact
    hidden: true

  - name: two-separate-clusters
    # The peak is two, reached twice rather than accumulating.
    arguments: [[[1, 3], [2, 4], [10, 12], [11, 13]]]
    expected: 2
    comparator: exact
    hidden: true

  - name: nothing-overlaps
    arguments: [[[1, 2], [3, 4], [5, 6]]]
    expected: 1
    comparator: exact
    hidden: true

  - name: a-zero-length-meeting
    # The instantaneous meeting ends the moment it starts, freeing its room.
    arguments: [[[1, 1], [1, 5]]]
    expected: 1
    comparator: exact
    hidden: true
