# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-two-steps
    arguments: [[1, 2, 3, 4, 5], 2]
    expected: [4, 5, 1, 2, 3]
    comparator: exact

  - name: example-more-steps-than-elements
    # Without the modulo the piece boundaries are out of range.
    arguments: [[1, 2], 3]
    expected: [2, 1]
    comparator: exact

  - name: no-rotation
    # The second reversal spans an empty range.
    arguments: [[1, 2, 3], 0]
    expected: [1, 2, 3]
    comparator: exact

  - name: a-full-turn
    # Reduces to zero steps.
    arguments: [[1, 2, 3], 3]
    expected: [1, 2, 3]
    comparator: exact

  - name: a-single-element
    arguments: [[9], 100]
    expected: [9]
    comparator: exact
    hidden: true

  - name: rotating-by-one
    arguments: [[1, 2, 3, 4], 1]
    expected: [4, 1, 2, 3]
    comparator: exact
    hidden: true

  - name: rotating-by-all-but-one
    # The same as rotating left by one, which is the direction to get wrong.
    arguments: [[1, 2, 3, 4], 3]
    expected: [2, 3, 4, 1]
    comparator: exact
    hidden: true

  - name: an-even-split
    arguments: [[1, 2, 3, 4], 2]
    expected: [3, 4, 1, 2]
    comparator: exact
    hidden: true

  - name: duplicated-values
    arguments: [[1, 1, 2, 2], 2]
    expected: [2, 2, 1, 1]
    comparator: exact
    hidden: true

  - name: a-very-large-step-count
    # A billion single-place rotations would not finish.
    arguments: [[1, 2, 3, 4, 5, 6, 7], 1000000000]
    expected: [2, 3, 4, 5, 6, 7, 1]
    comparator: exact
    hidden: true
