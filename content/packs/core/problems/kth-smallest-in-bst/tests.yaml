# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-smallest
    arguments: [[3, 1, 4, null, 2], 1]
    expected: 1
    comparator: exact

  - name: example-third-smallest
    arguments: [[5, 3, 6, 2, 4, null, null, 1], 3]
    expected: 3
    comparator: exact

  - name: single-node
    # k counts from 1, so this is the answer.
    arguments: [[1], 1]
    expected: 1
    comparator: exact

  - name: k-is-the-largest
    # An early exit that fires one step too soon returns 3.
    arguments: [[3, 1, 4, null, 2], 4]
    expected: 4
    comparator: exact

  - name: k-in-the-middle-of-three
    arguments: [[2, 1, 3], 2]
    expected: 2
    comparator: exact
    hidden: true

  - name: left-leaning-chain
    # The smallest is the deepest node, so the descent must go all the way
    # down.
    arguments: [[3, 2, null, 1], 1]
    expected: 1
    comparator: exact
    hidden: true

  - name: right-leaning-chain
    arguments: [[1, null, 2, null, null, null, 3], 3]
    expected: 3
    comparator: exact
    hidden: true

  - name: second-in-a-chain
    arguments: [[3, 2, null, 1], 2]
    expected: 2
    comparator: exact
    hidden: true

  - name: last-of-six
    arguments: [[5, 3, 6, 2, 4, null, null, 1], 6]
    expected: 6
    comparator: exact
    hidden: true
