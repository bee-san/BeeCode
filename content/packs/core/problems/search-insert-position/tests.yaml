# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-the-target-is-present
    arguments: [[1, 3, 5, 6], 5]
    expected: 2
    comparator: exact

  - name: example-the-target-goes-in-the-middle
    arguments: [[1, 3, 5, 6], 2]
    expected: 1
    comparator: exact

  - name: the-target-goes-past-the-end
    # A search bounded at len - 1 cannot return this.
    arguments: [[1, 3, 5, 6], 7]
    expected: 4
    comparator: exact

  - name: the-target-goes-before-everything
    arguments: [[1, 3, 5, 6], 0]
    expected: 0
    comparator: exact

  - name: an-empty-list
    arguments: [[], 5]
    expected: 0
    comparator: exact
    hidden: true

  - name: a-single-element-that-matches
    arguments: [[3], 3]
    expected: 0
    comparator: exact
    hidden: true

  - name: a-single-element-and-a-larger-target
    arguments: [[3], 4]
    expected: 1
    comparator: exact
    hidden: true

  - name: a-single-element-and-a-smaller-target
    arguments: [[3], 2]
    expected: 0
    comparator: exact
    hidden: true

  - name: the-first-element
    arguments: [[1, 3, 5, 6], 1]
    expected: 0
    comparator: exact
    hidden: true

  - name: the-last-element
    arguments: [[1, 3, 5, 6], 6]
    expected: 3
    comparator: exact
    hidden: true

  - name: negative-values
    arguments: [[-5, -3, -1], -4]
    expected: 1
    comparator: exact
    hidden: true
