# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-third-largest
    arguments: [3, [4, 5, 8, 2], [3, 5, 10, 9, 4]]
    expected: [4, 5, 5, 8, 8]
    comparator: exact

  - name: example-running-maximum
    arguments: [1, [], [7, 3, 9]]
    expected: [7, 7, 9]
    comparator: exact

  - name: duplicates-count-separately
    # Two fives, so the second largest is 5. A set-based answer has no second
    # value.
    arguments: [2, [5], [5]]
    expected: [5]
    comparator: exact

  - name: first-add-completes-the-count
    # Exactly k values now, so the answer is the smallest of them.
    arguments: [3, [1, 2], [3]]
    expected: [1]
    comparator: exact

  - name: negative-values
    arguments: [2, [-5, -1], [-3]]
    expected: [-3]
    comparator: exact
    hidden: true

  - name: descending-additions
    # Nothing new enters the top two, so the answer is unchanged.
    arguments: [2, [10, 9], [8, 7, 6]]
    expected: [9, 9, 9]
    comparator: exact
    hidden: true

  - name: ascending-additions
    arguments: [2, [1, 2], [3, 4, 5]]
    expected: [2, 3, 4]
    comparator: exact
    hidden: true

  - name: all-values-equal
    arguments: [3, [4, 4, 4], [4, 4]]
    expected: [4, 4]
    comparator: exact
    hidden: true

  - name: k-equals-one-with-a-single-value
    # Zero is a valid value, so a heap seeded with a zero sentinel is wrong.
    arguments: [1, [], [0]]
    expected: [0]
    comparator: exact
    hidden: true
