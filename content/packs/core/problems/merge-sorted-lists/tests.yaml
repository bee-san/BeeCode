# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-interleaved
    arguments: [[1, 2, 4], [1, 3, 4]]
    expected: [1, 1, 2, 3, 4, 4]
    comparator: exact

  - name: example-one-side-empty
    arguments: [[], [0]]
    expected: [0]
    comparator: exact

  - name: both-empty
    arguments: [[], []]
    expected: []
    comparator: exact

  - name: no-overlap-a-entirely-first
    # Exercises the drain step: b is untouched until a runs out.
    arguments: [[1, 2, 3], [7, 8, 9]]
    expected: [1, 2, 3, 7, 8, 9]
    comparator: exact

  - name: no-overlap-b-entirely-first
    arguments: [[7, 8, 9], [1, 2, 3]]
    expected: [1, 2, 3, 7, 8, 9]
    comparator: exact

  - name: all-identical-values
    # Every comparison is a tie, so a merge that drops equal elements loses half
    # the output.
    arguments: [[2, 2, 2], [2, 2]]
    expected: [2, 2, 2, 2, 2]
    comparator: exact
    hidden: true

  - name: negatives-and-uneven-lengths
    arguments: [[-9, -3, 0, 4], [-5, 12]]
    expected: [-9, -5, -3, 0, 4, 12]
    comparator: exact
    hidden: true
