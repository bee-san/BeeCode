# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-one-removal
    # Touching intervals may all stay, which a strict comparison would deny.
    arguments: [[[1, 2], [2, 3], [3, 4], [1, 3]]]
    expected: 1
    comparator: exact

  - name: example-three-identical
    arguments: [[[1, 2], [1, 2], [1, 2]]]
    expected: 2
    comparator: exact

  - name: a-single-interval
    arguments: [[[1, 2]]]
    expected: 0
    comparator: exact

  - name: a-long-interval-blocks-two-short-ones
    # Sorting by start considers the long one first and answers 2.
    arguments: [[[1, 100], [2, 3], [4, 5]]]
    expected: 1
    comparator: exact

  - name: nothing-overlaps
    arguments: [[[1, 2], [3, 4], [5, 6]]]
    expected: 0
    comparator: exact
    hidden: true

  - name: everything-overlaps-one-point
    arguments: [[[1, 5], [2, 6], [3, 7]]]
    expected: 2
    comparator: exact
    hidden: true

  - name: the-input-is-unsorted
    # No ordering is promised, so the sort is not optional.
    arguments: [[[5, 6], [1, 2], [3, 4]]]
    expected: 0
    comparator: exact
    hidden: true

  - name: one-interval-inside-another
    arguments: [[[1, 10], [2, 3]]]
    expected: 1
    comparator: exact
    hidden: true

  - name: a-chain-of-touching-intervals
    arguments: [[[1, 2], [2, 3], [3, 4], [4, 5]]]
    expected: 0
    comparator: exact
    hidden: true

  - name: two-clusters
    arguments: [[[1, 4], [2, 5], [3, 6], [10, 12], [11, 13]]]
    expected: 3
    comparator: exact
    hidden: true
