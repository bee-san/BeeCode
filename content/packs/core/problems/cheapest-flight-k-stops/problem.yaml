# Schema version of this authoring format. Bumped when the loader's expectations
# change, so an old Problem folder fails loudly rather than being misread.
schemaVersion: 1


title: Cheapest Route Within K Stops
difficulty: medium
# What this Problem is made of, and what it trains. Both are validated against
# the pack's taxonomy.yaml, so a typo fails the build rather than silently
# creating a topic with one Problem in it.
dataStructures:
  - graph
  - array
algorithms:
  - dynamic-programming
  - shortest-path

# The function BeeCode calls to test the solution. Must match starter.py and
# reference.py.
entryPoint: cheapest_within

# Worked examples shown with the statement. These are illustrative only; judging
# uses tests.yaml.
examples:
  - input: "n = 4, flights = [[0,1,100],[1,2,100],[2,0,100],[1,3,600],[2,3,200]], start = 0, target = 3, k = 1"
    output: "700"
    explanation: "0 to 1 to 3 costs 700 with one stop. The cheaper 0-1-2-3 at 400 uses two stops."
  - input: "n = 3, flights = [[0,1,100],[1,2,100],[0,2,500]], start = 0, target = 2, k = 0"
    output: "500"
    explanation: "With no stops allowed, only the direct flight qualifies."

