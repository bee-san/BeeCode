# Schema version of this authoring format. Bumped when the loader's expectations
# change, so an old Problem folder fails loudly rather than being misread.
schemaVersion: 1


title: Ways to Decode a Digit String
difficulty: medium
# What this Problem is made of, and what it trains. Both are validated against
# the pack's taxonomy.yaml, so a typo fails the build rather than silently
# creating a topic with one Problem in it.
dataStructures:
  - string
algorithms:
  - dynamic-programming

# The function BeeCode calls to test the solution. Must match starter.py and
# reference.py.
entryPoint: count_decodings

# Worked examples shown with the statement. These are illustrative only; judging
# uses tests.yaml.
examples:
  - input: "digits = \"12\""
    output: "2"
    explanation: "\"ab\" from 1 and 2, or \"l\" from 12."
  - input: "digits = \"226\""
    output: "3"
    explanation: "\"bbf\", \"bz\", \"vf\"."
  - input: "digits = \"06\""
    output: "0"
    explanation: "A leading zero decodes as nothing."

provenance:
  origin: original
  author: bee-san
  license: CC-BY-4.0
  notes: >
    Statement written for BeeCode. The underlying exercise is a classic
    interview question in the public domain; no third-party text is reproduced.

limits:
  wallClockMillis: 5000
  maxOutputBytes: 65536
