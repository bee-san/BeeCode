# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-runs-and-a-singleton
    arguments: [[0, 1, 2, 4, 5, 7]]
    expected: ["0->2", "4->5", "7"]
    comparator: exact

  - name: example-alternating
    arguments: [[0, 2, 3, 4, 6, 8, 9]]
    expected: ["0", "2->4", "6", "8->9"]
    comparator: exact

  - name: an-empty-list
    arguments: [[]]
    expected: []
    comparator: exact

  - name: a-single-value
    # Not 5->5.
    arguments: [[5]]
    expected: ["5"]
    comparator: exact

  - name: one-unbroken-run
    arguments: [[1, 2, 3, 4, 5]]
    expected: ["1->5"]
    comparator: exact
    hidden: true

  - name: no-two-values-adjacent
    # A gap of one still breaks the run.
    arguments: [[1, 3, 5]]
    expected: ["1", "3", "5"]
    comparator: exact
    hidden: true

  - name: a-pair
    arguments: [[1, 2]]
    expected: ["1->2"]
    comparator: exact
    hidden: true

  - name: negative-values
    arguments: [[-3, -2, -1, 1]]
    expected: ["-3->-1", "1"]
    comparator: exact
    hidden: true

  - name: a-run-crossing-zero
    arguments: [[-1, 0, 1]]
    expected: ["-1->1"]
    comparator: exact
    hidden: true

  - name: the-extremes-of-the-range
    # Two singletons; a difference-based run test could overflow here.
    arguments: [[-2147483648, 2147483647]]
    expected: ["-2147483648", "2147483647"]
    comparator: exact
    hidden: true
