# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-one-duplicate
    arguments: [[1, 1, 2]]
    expected: 2
    comparator: exact

  - name: example-several-runs
    arguments: [[0, 0, 1, 1, 1, 2, 2, 3, 3, 4]]
    expected: 5
    comparator: exact

  - name: a-single-element
    arguments: [[5]]
    expected: 1
    comparator: exact

  - name: no-duplicates
    arguments: [[1, 2, 3, 4]]
    expected: 4
    comparator: exact

  - name: every-value-the-same
    arguments: [[7, 7, 7, 7, 7]]
    expected: 1
    comparator: exact
    hidden: true

  - name: two-identical-values
    # Starting the write index at 0 answers 2 here.
    arguments: [[2, 2]]
    expected: 1
    comparator: exact
    hidden: true

  - name: the-duplicate-run-is-at-the-end
    arguments: [[1, 2, 3, 3, 3]]
    expected: 3
    comparator: exact
    hidden: true

  - name: negative-values
    arguments: [[-3, -3, -1, 0, 0, 2]]
    expected: 4
    comparator: exact
    hidden: true

  - name: alternating-run-lengths
    arguments: [[1, 1, 2, 3, 3, 3, 4]]
    expected: 4
    comparator: exact
    hidden: true

  - name: two-distinct-values
    arguments: [[1, 2]]
    expected: 2
    comparator: exact
    hidden: true
