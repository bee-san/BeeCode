# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-five-nodes
    arguments: [[[7, null], [13, 0], [11, 4], [10, 2], [1, 0]]]
    expected: [[7, null], [13, 7], [11, 1], [10, 11], [1, 7]]
    comparator: exact

  - name: example-self-random
    # A node aiming at itself. Its copy must aim at the copy, not the
    # original.
    arguments: [[[5, 0]]]
    expected: [[5, 5]]
    comparator: exact

  - name: empty-list
    arguments: [[]]
    expected: []
    comparator: exact

  - name: single-node-no-random
    arguments: [[[3, null]]]
    expected: [[3, null]]
    comparator: exact

  - name: every-random-null
    # A plain chain. Catches an unguarded read of random.value.
    arguments: [[[1, null], [2, null], [3, null]]]
    expected: [[1, null], [2, null], [3, null]]
    comparator: exact
    hidden: true

  - name: randoms-point-forward-and-back
    arguments: [[[2, 2], [4, 0], [9, null]]]
    expected: [[2, 9], [4, 2], [9, null]]
    comparator: exact
    hidden: true

  - name: repeated-values
    # Two distinct nodes holding the same value, which a value-keyed map
    # merges.
    arguments: [[[7, 1], [7, 0]]]
    expected: [[7, 7], [7, 7]]
    comparator: exact
    hidden: true

  - name: all-randoms-at-the-last-node
    # Every random aims at a node created after it, so one pass cannot resolve
    # them.
    arguments: [[[1, 3], [2, 3], [3, 3], [4, 3]]]
    expected: [[1, 4], [2, 4], [3, 4], [4, 4]]
    comparator: exact
    hidden: true
