# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-four-balloons
    arguments: [[3, 1, 5, 8]]
    expected: 167
    comparator: exact

  - name: example-two-balloons
    arguments: [[1, 5]]
    expected: 10
    comparator: exact

  - name: a-single-balloon
    # Both neighbours are missing, so both count as 1.
    arguments: [[5]]
    expected: 5
    comparator: exact

  - name: a-zero-among-the-values
    arguments: [[0]]
    expected: 0
    comparator: exact

  - name: two-equal-balloons
    # Burst one for 1*2*2=4, then the other for 1*2*1=2.
    arguments: [[2, 2]]
    expected: 6
    comparator: exact
    hidden: true

  - name: three-ascending
    # Burst 2 (1*2*3=6), then 1 (1*1*3=3), then 3 (1*3*1=3).
    arguments: [[1, 2, 3]]
    expected: 12
    comparator: exact
    hidden: true

  - name: a-zero-separates-its-neighbours
    # Bursting the 0 first earns 5*0*5=0 but lets the two 5s become
    # neighbours: 1*5*5=25 then 1*5*1=5.
    arguments: [[5, 0, 5]]
    expected: 30
    comparator: exact
    hidden: true

  - name: all-ones
    arguments: [[1, 1, 1]]
    expected: 3
    comparator: exact
    hidden: true

  - name: a-large-value-in-the-middle
    # Burst an outer 2 for 1*2*100=200, then the other for 100*2*1=200, then
    # 1*100*1=100.
    arguments: [[2, 100, 2]]
    expected: 500
    comparator: exact
    hidden: true

  - name: five-balloons
    arguments: [[9, 76, 64, 21, 97]]
    expected: 669494
    comparator: exact
    hidden: true
