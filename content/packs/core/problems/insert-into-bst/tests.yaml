# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-into-a-perfect-tree
    arguments: [[4, 2, 7, 1, 3], 5]
    expected: [4, 2, 7, 1, 3, 5]
    comparator: exact

  - name: example-empty-tree-gains-a-root
    arguments: [[], 5]
    expected: [5]
    comparator: exact

  - name: smaller-than-the-only-node
    arguments: [[1], 0]
    expected: [1, 0]
    comparator: exact

  - name: larger-than-the-only-node-needs-a-gap
    # The right child is index 2, so index 1 must be padded with None rather
    # than the value landing next to the root.
    arguments: [[1], 2]
    expected: [1, null, 2]
    comparator: exact

  - name: descends-two-levels
    arguments: [[40, 20, 60, 10, 30, 50, 70], 25]
    expected: [40, 20, 60, 10, 30, 50, 70, null, null, 25]
    comparator: exact

  - name: fills-an-absent-right-child
    arguments: [[5, 3, 8, null, 4], 9]
    expected: [5, 3, 8, null, 4, null, 9]
    comparator: exact

  - name: negative-values
    arguments: [[-5, -10, -1], -7]
    expected: [-5, -10, -1, null, -7]
    comparator: exact
    hidden: true

  - name: extends-a-right-leaning-chain
    # Every value is larger than the last, so the tree is really a chain and the
    # returned list is mostly padding.
    arguments: [[1, null, 2, null, null, null, 3], 4]
    expected: [1, null, 2, null, null, null, 3, null, null, null, null, null, null, null, 4]
    comparator: exact
    hidden: true
