# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-right-leaning
    arguments: [[1, null, 2, null, null, 3]]
    expected: [1, 3, 2]
    comparator: exact

  - name: example-balanced
    arguments: [[2, 1, 3]]
    expected: [1, 2, 3]
    comparator: exact

  - name: empty-tree
    arguments: [[]]
    expected: []
    comparator: exact

  - name: root-only
    arguments: [[7]]
    expected: [7]
    comparator: exact

  - name: left-chain
    # A pure left chain: the deepest node is visited first.
    arguments: [[3, 2, null, 1]]
    expected: [1, 2, 3]
    comparator: exact

  - name: duplicates-are-kept
    # This is a traversal, not a set; repeated values all appear.
    arguments: [[2, 2, 2]]
    expected: [2, 2, 2]
    comparator: exact
    hidden: true

  - name: zero-is-a-node-not-a-gap
    arguments: [[1, 0, 2]]
    expected: [0, 1, 2]
    comparator: exact
    hidden: true

  - name: gap-in-the-middle
    # An absent left child must not shift the remaining indices.
    arguments: [[5, 3, 8, null, 4, 7]]
    expected: [3, 4, 5, 7, 8]
    comparator: exact
    hidden: true
