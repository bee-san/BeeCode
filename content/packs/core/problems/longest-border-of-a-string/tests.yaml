# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-an-overlapping-border
    # The border overlaps itself, which is allowed.
    arguments: ["ababab"]
    expected: 4
    comparator: exact

  - name: example-no-border
    arguments: ["abcd"]
    expected: 0
    comparator: exact

  - name: a-single-character
    # A border must be a proper prefix.
    arguments: ["a"]
    expected: 0
    comparator: exact

  - name: the-whole-string-repeated-twice
    arguments: ["abab"]
    expected: 2
    comparator: exact

  - name: every-character-the-same
    # The longest proper prefix is also a suffix.
    arguments: ["aaaa"]
    expected: 3
    comparator: exact
    hidden: true

  - name: a-fallback-is-needed
    # Extending fails partway and the chain of borders has to be walked, which
    # decrementing by one gets wrong.
    arguments: ["aabaaab"]
    expected: 3
    comparator: exact
    hidden: true

  - name: two-characters-that-differ
    arguments: ["ab"]
    expected: 0
    comparator: exact
    hidden: true

  - name: two-characters-that-match
    arguments: ["aa"]
    expected: 1
    comparator: exact
    hidden: true

  - name: a-border-of-one
    arguments: ["abca"]
    expected: 1
    comparator: exact
    hidden: true

  - name: a-longer-string-with-a-long-border
    arguments: ["abcabcabc"]
    expected: 6
    comparator: exact
    hidden: true

  - name: a-near-miss-at-the-end
    # abc almost repeats, and the final character breaks it.
    arguments: ["abcabd"]
    expected: 0
    comparator: exact
    hidden: true
