# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-one-journey
    arguments: [[["in", [1, "kings", 3]], ["out", [1, "bank", 8]], ["average", ["kings", "bank"]]]]
    expected: [5.0]
    comparator: approximate_numeric

  - name: example-two-journeys-averaged
    # Journeys of 4 and 6.
    arguments: [[["in", [1, "a", 0]], ["out", [1, "b", 4]], ["in", [2, "a", 10]], ["out", [2, "b", 16]], ["average", ["a", "b"]]]]
    expected: [5.0]
    comparator: approximate_numeric

  - name: the-average-is-fractional
    # Integer division answers 2 here.
    arguments: [[["in", [1, "a", 0]], ["out", [1, "b", 2]], ["in", [2, "a", 0]], ["out", [2, "b", 3]], ["average", ["a", "b"]]]]
    expected: [2.5]
    comparator: approximate_numeric

  - name: the-two-directions-are-separate
    # An unordered route key would answer 6 for both.
    arguments: [[["in", [1, "a", 0]], ["out", [1, "b", 10]], ["in", [2, "b", 20]], ["out", [2, "a", 22]], ["average", ["a", "b"]], ["average", ["b", "a"]]]]
    expected: [10.0, 2.0]
    comparator: approximate_numeric

  - name: one-passenger-travelling-twice
    # The second journey must measure from the second entry, not the first.
    arguments: [[["in", [1, "a", 0]], ["out", [1, "b", 4]], ["in", [1, "a", 10]], ["out", [1, "b", 20]], ["average", ["a", "b"]]]]
    expected: [7.0]
    comparator: approximate_numeric
    hidden: true

  - name: asking-twice-gives-the-same-answer
    arguments: [[["in", [1, "a", 0]], ["out", [1, "b", 6]], ["average", ["a", "b"]], ["average", ["a", "b"]]]]
    expected: [6.0, 6.0]
    comparator: approximate_numeric
    hidden: true

  - name: a-journey-taking-no-time
    arguments: [[["in", [1, "a", 5]], ["out", [1, "b", 5]], ["average", ["a", "b"]]]]
    expected: [0.0]
    comparator: approximate_numeric
    hidden: true

  - name: two-passengers-overlapping
    # Journeys of 4 and 6, recorded out of entry order.
    arguments: [[["in", [1, "a", 0]], ["in", [2, "a", 1]], ["out", [1, "b", 4]], ["out", [2, "b", 7]], ["average", ["a", "b"]]]]
    expected: [5.0]
    comparator: approximate_numeric
    hidden: true

  - name: the-average-updates-between-queries
    arguments: [[["in", [1, "a", 0]], ["out", [1, "b", 2]], ["average", ["a", "b"]], ["in", [2, "a", 0]], ["out", [2, "b", 8]], ["average", ["a", "b"]]]]
    expected: [2.0, 5.0]
    comparator: approximate_numeric
    hidden: true

  - name: three-distinct-routes
    arguments: [[["in", [1, "a", 0]], ["out", [1, "b", 2]], ["in", [2, "b", 0]], ["out", [2, "c", 4]], ["in", [3, "a", 0]], ["out", [3, "c", 9]], ["average", ["a", "b"]], ["average", ["b", "c"]], ["average", ["a", "c"]]]]
    expected: [2.0, 4.0, 9.0]
    comparator: approximate_numeric
    hidden: true

  - name: a-station-visited-as-both-start-and-end
    arguments: [[["in", [1, "a", 0]], ["out", [1, "b", 3]], ["in", [1, "b", 5]], ["out", [1, "c", 6]], ["average", ["a", "b"]], ["average", ["b", "c"]]]]
    expected: [3.0, 1.0]
    comparator: approximate_numeric
    hidden: true
