# Schema version of this authoring format. Bumped when the loader's expectations
# change, so an old Problem folder fails loudly rather than being misread.
schemaVersion: 1

title: Product of Array Except Self
difficulty: medium
topics:
  - arrays
  - prefix-sum

# The function BeeCode calls to test the solution. Must match starter.py and
# reference.py.
entryPoint: product_except_self

# Worked examples shown with the statement. These are illustrative only; judging
# uses tests.yaml.
examples:
  - input: "nums = [1, 2, 3, 4]"
    output: "[24, 12, 8, 6]"
    explanation: "24 = 2*3*4, 12 = 1*3*4, 8 = 1*2*4, 6 = 1*2*3."
  - input: "nums = [-1, 1, 0, -3, 3]"
    output: "[0, 0, 9, 0, 0]"
    explanation: >
      The single zero makes every product zero except at the zero's own position,
      where the answer is the product of the other four values.

