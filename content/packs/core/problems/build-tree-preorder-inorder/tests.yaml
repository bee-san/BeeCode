# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-classic
    arguments: [[3, 9, 20, 15, 7], [9, 3, 15, 20, 7]]
    expected: [3, 9, 20, null, null, 15, 7]
    comparator: exact

  - name: example-left-child
    arguments: [[1, 2], [2, 1]]
    expected: [1, 2]
    comparator: exact

  - name: empty
    arguments: [[], []]
    expected: []
    comparator: exact

  - name: single-node
    arguments: [[-1], [-1]]
    expected: [-1]
    comparator: exact

  - name: right-child
    # Same pre-order as the left-child case; only the in-order distinguishes
    # them.
    arguments: [[1, 2], [1, 2]]
    expected: [1, null, 2]
    comparator: exact
    hidden: true

  - name: left-leaning-chain
    arguments: [[1, 2, 3], [3, 2, 1]]
    expected: [1, 2, null, 3]
    comparator: exact
    hidden: true

  - name: right-leaning-chain
    # The same pre-order as the left chain, and the indices grow much faster.
    arguments: [[1, 2, 3], [1, 2, 3]]
    expected: [1, null, 2, null, null, null, 3]
    comparator: exact
    hidden: true

  - name: left-subtree-leans-right
    arguments: [[3, 1, 2, 4], [1, 2, 3, 4]]
    expected: [3, 1, 4, null, 2]
    comparator: exact
    hidden: true

  - name: perfect-tree
    arguments: [[4, 2, 1, 3, 6, 5, 7], [1, 2, 3, 4, 5, 6, 7]]
    expected: [4, 2, 6, 1, 3, 5, 7]
    comparator: exact
    hidden: true
