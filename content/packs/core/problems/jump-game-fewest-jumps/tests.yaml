# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-two-jumps
    arguments: [[2, 3, 1, 1, 4]]
    expected: 2
    comparator: exact

  - name: example-a-single-element
    # Already at the end, so no jump is needed.
    arguments: [[0]]
    expected: 0
    comparator: exact

  - name: two-elements
    # Looping to the last index instead of stopping one short answers 2.
    arguments: [[1, 1]]
    expected: 1
    comparator: exact

  - name: one-jump-clears-everything
    arguments: [[5, 0, 0, 0, 0, 0]]
    expected: 1
    comparator: exact

  - name: all-ones
    arguments: [[1, 1, 1, 1]]
    expected: 3
    comparator: exact
    hidden: true

  - name: a-nearer-index-reaches-further
    # From index 0 only index 1 is available, and its reach of 5 covers the
    # rest.
    arguments: [[1, 4, 1, 1, 1, 1]]
    expected: 2
    comparator: exact
    hidden: true

  - name: the-largest-value-is-not-the-best-jump
    # Jumping to index 2 for its 3 reaches index 5; going to index 1 first is
    # no better. Comparing index plus reach is what decides.
    arguments: [[2, 1, 3, 1, 1, 1, 1]]
    expected: 3
    comparator: exact
    hidden: true

  - name: a-long-first-jump-then-short-ones
    arguments: [[3, 1, 1, 1]]
    expected: 1
    comparator: exact
    hidden: true

  - name: the-level-boundary-lands-on-the-end
    arguments: [[2, 1]]
    expected: 1
    comparator: exact
    hidden: true

  - name: a-longer-array
    arguments: [[2, 3, 0, 1, 4]]
    expected: 2
    comparator: exact
    hidden: true
