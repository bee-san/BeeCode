# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-seven-to-fifteen
    arguments: [[10, 5, 15, 3, 7, null, 18], 7, 15]
    expected: 32
    comparator: exact

  - name: example-six-to-ten
    arguments: [[10, 5, 15, 3, 7, 13, 18, 1, null, 6], 6, 10]
    expected: 23
    comparator: exact

  - name: empty-tree
    arguments: [[], 1, 5]
    expected: 0
    comparator: exact

  - name: single-node-in-range
    arguments: [[1], 1, 1]
    expected: 1
    comparator: exact

  - name: single-node-out-of-range
    arguments: [[1], 2, 3]
    expected: 0
    comparator: exact

  - name: whole-tree-in-range
    arguments: [[5, 3, 8, 2, 4, 7, 9], 1, 100]
    expected: 38
    comparator: exact

  - name: bounds-are-inclusive-at-the-top
    # high is exactly a node's value, so a strict comparison loses it.
    arguments: [[2, 1, 3], 3, 3]
    expected: 3
    comparator: exact

  - name: bounds-are-inclusive-at-the-bottom
    arguments: [[2, 1, 3], 1, 1]
    expected: 1
    comparator: exact
    hidden: true

  - name: range-straddles-both-subtrees
    arguments: [[40, 20, 60, 10, 30, 50, 70], 25, 65]
    expected: 180
    comparator: exact
    hidden: true
