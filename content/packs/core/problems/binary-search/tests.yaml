# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-found
    arguments: [[-1, 0, 3, 5, 9, 12], 9]
    expected: 4
    comparator: exact

  - name: example-absent
    arguments: [[-1, 0, 3, 5, 9, 12], 2]
    expected: -1
    comparator: exact

  - name: empty-list
    arguments: [[], 1]
    expected: -1
    comparator: exact

  - name: single-element-hit
    arguments: [[5], 5]
    expected: 0
    comparator: exact

  - name: single-element-miss
    arguments: [[5], -5]
    expected: -1
    comparator: exact

  - name: first-and-last-positions
    # The extremes are where an inclusive/exclusive high-bound mix-up shows up.
    arguments: [[1, 2, 3, 4, 5, 6], 6]
    expected: 5
    comparator: exact
    hidden: true

  - name: target-below-everything
    # Must terminate rather than spin when the search window collapses at index 0.
    arguments: [[2, 4, 6, 8], 1]
    expected: -1
    comparator: exact
    hidden: true
