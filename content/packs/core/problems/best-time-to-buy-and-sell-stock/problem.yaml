# Schema version of this authoring format. Bumped when the loader's expectations
# change, so an old Problem folder fails loudly rather than being misread.
schemaVersion: 1

title: Best Time to Buy and Sell Stock
difficulty: easy
topics:
  - arrays
  - greedy

# The function BeeCode calls to test the solution. Must match starter.py and
# reference.py.
entryPoint: max_profit

# Worked examples shown with the statement. These are illustrative only; judging
# uses tests.yaml.
examples:
  - input: "prices = [7, 1, 5, 3, 6, 4]"
    output: "5"
    explanation: "Buy on day 1 at 1 and sell on day 4 at 6, for a profit of 5."
  - input: "prices = [7, 6, 4, 3, 1]"
    output: "0"
    explanation: >
      The price only ever falls, so every trade would lose money. Making no
      trade at all yields 0.

provenance:
