# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-profitable
    arguments: [[7, 1, 5, 3, 6, 4]]
    expected: 5
    comparator: exact

  - name: example-monotonically-falling
    arguments: [[7, 6, 4, 3, 1]]
    expected: 0
    comparator: exact

  - name: empty-list
    arguments: [[]]
    expected: 0
    comparator: exact

  - name: single-day-cannot-trade
    arguments: [[3]]
    expected: 0
    comparator: exact

  - name: all-same-price
    arguments: [[4, 4, 4, 4]]
    expected: 0
    comparator: exact

  - name: cheapest-day-is-last
    # The minimum price is on the final day, so it can never be a buy. Solutions
    # that compute max(prices) - min(prices) return 3 here instead of 2.
    arguments: [[2, 4, 1]]
    expected: 2
    comparator: exact
    hidden: true

  - name: best-buy-precedes-a-later-deeper-dip
    # The global minimum (1 at index 4) has only a small rise after it. The real
    # answer buys at 2 on day 1 and sells at 9 on day 3.
    arguments: [[6, 2, 5, 9, 1, 3]]
    expected: 7
    comparator: exact
    hidden: true
