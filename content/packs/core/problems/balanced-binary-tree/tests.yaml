# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-balanced
    arguments: [[3, 9, 20, null, null, 15, 7]]
    expected: true
    comparator: exact

  - name: example-root-looks-fine-but-a-child-does-not
    # The root's subtree heights are 3 and 2, so a root-only check returns
    # True. Node 2 is the one that breaks it.
    arguments: [[1, 2, 3, 4, null, 6, 7, 8]]
    expected: false
    comparator: exact

  - name: empty-tree
    arguments: [[]]
    expected: true
    comparator: exact

  - name: single-node
    arguments: [[1]]
    expected: true
    comparator: exact

  - name: two-nodes-differ-by-one
    # Heights 1 and 0. A difference of exactly one is allowed.
    arguments: [[1, 2]]
    expected: true
    comparator: exact
    hidden: true

  - name: chain-of-three-is-unbalanced
    arguments: [[1, 2, null, 3]]
    expected: false
    comparator: exact
    hidden: true

  - name: classic-unbalanced-tree
    arguments: [[1, 2, 2, 3, 3, null, null, 4, 4]]
    expected: false
    comparator: exact
    hidden: true

  - name: perfect-tree
    arguments: [[1, 2, 3, 4, 5, 6, 7]]
    expected: true
    comparator: exact
    hidden: true
