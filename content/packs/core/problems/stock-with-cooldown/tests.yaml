# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-two-trades
    # Ignoring the cooldown would allow a fourth unit of profit.
    arguments: [[1, 2, 3, 0, 2]]
    expected: 3
    comparator: exact

  - name: example-a-single-day
    arguments: [[1]]
    expected: 0
    comparator: exact

  - name: prices-only-fall
    # No trade beats not trading.
    arguments: [[5, 4, 3]]
    expected: 0
    comparator: exact

  - name: one-trade-beats-two-small-ones
    # Without the cooldown, buying and selling twice also gives 2; with it,
    # only the single trade from 1 to 3 is available.
    arguments: [[1, 2, 3]]
    expected: 2
    comparator: exact

  - name: two-days-rising
    arguments: [[1, 5]]
    expected: 4
    comparator: exact
    hidden: true

  - name: two-days-falling
    arguments: [[5, 1]]
    expected: 0
    comparator: exact
    hidden: true

  - name: the-cooldown-forces-a-choice
    # Buying at 1 and selling at 3 earns 2 but forfeits the buy at 2, so the
    # single trade from 1 to 4 wins.
    arguments: [[1, 3, 2, 4]]
    expected: 3
    comparator: exact
    hidden: true

  - name: all-equal-prices
    arguments: [[2, 2, 2, 2]]
    expected: 0
    comparator: exact
    hidden: true

  - name: a-long-alternation
    # The cooldown allows only two of the three rises.
    arguments: [[1, 4, 1, 4, 1, 4]]
    expected: 6
    comparator: exact
    hidden: true

  - name: a-zero-price
    # Buying at 0 is allowed and is the best move.
    arguments: [[3, 0, 5]]
    expected: 5
    comparator: exact
    hidden: true
