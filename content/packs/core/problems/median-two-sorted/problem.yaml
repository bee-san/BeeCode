# Schema version of this authoring format. Bumped when the loader's expectations
# change, so an old Problem folder fails loudly rather than being misread.
schemaVersion: 1

title: Median of Two Sorted Arrays
difficulty: hard
# What this Problem is made of, and what it trains. Both are validated against
# the pack's taxonomy.yaml, so a typo fails the build rather than silently
# creating a topic with one Problem in it.
dataStructures:
  - array
algorithms:
  - binary-search
  - divide-and-conquer

# The function BeeCode calls to test the solution. Must match starter.py and
# reference.py.
entryPoint: median_of_sorted

# Worked examples shown with the statement. These are illustrative only; judging
# uses tests.yaml.
examples:
  - input: "a = [1, 3], b = [2]"
    output: "2.0"
    explanation: "Merged the values are [1, 2, 3]; the middle one is 2."
  - input: "a = [1, 2], b = [3, 4]"
    output: "2.5"
    explanation: >
      Merged the values are [1, 2, 3, 4]. With an even count the median is the mean
      of the two middle values, (2 + 3) / 2.

provenance:
  origin: original
  author: bee-san
  license: CC-BY-4.0
  notes: >
    Statement written for BeeCode. The underlying exercise is a classic interview
    question in the public domain; no third-party text is reproduced.

limits:
  wallClockMillis: 5000
  maxOutputBytes: 65536
