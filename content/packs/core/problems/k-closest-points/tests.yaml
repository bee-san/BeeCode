# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-single-point
    arguments: [[[1, 3], [-2, 2]], 1]
    expected: [[-2, 2]]
    comparator: exact

  - name: example-two-of-three
    arguments: [[[3, 3], [5, -1], [-2, 4]], 2]
    expected: [[3, 3], [-2, 4]]
    comparator: exact

  - name: k-is-every-point
    # Everything is returned, but still ordered by distance.
    arguments: [[[2, 0], [1, 0]], 2]
    expected: [[1, 0], [2, 0]]
    comparator: exact

  - name: origin-itself
    # Distance zero. A heap seeded with a zero sentinel discards it.
    arguments: [[[0, 0], [1, 1]], 1]
    expected: [[0, 0]]
    comparator: exact

  - name: single-point
    arguments: [[[7, -7]], 1]
    expected: [[7, -7]]
    comparator: exact
    hidden: true

  - name: already-in-order
    arguments: [[[1, 0], [2, 0], [3, 0]], 2]
    expected: [[1, 0], [2, 0]]
    comparator: exact
    hidden: true

  - name: reverse-order-input
    # The heap pops these furthest-first, so a missing reverse is visible.
    arguments: [[[3, 0], [2, 0], [1, 0]], 2]
    expected: [[1, 0], [2, 0]]
    comparator: exact
    hidden: true

  - name: negative-coordinates-in-every-quadrant
    # Squared distances 2, 50, 37, 13. Signs must not affect the ordering.
    arguments: [[[-1, -1], [5, 5], [-6, 1], [2, -3]], 2]
    expected: [[-1, -1], [2, -3]]
    comparator: exact
    hidden: true

  - name: large-coordinates
    # Squaring these overflows a 32-bit int in other languages.
    arguments: [[[10000, 10000], [1, 0]], 1]
    expected: [[1, 0]]
    comparator: exact
    hidden: true
