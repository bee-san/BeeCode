# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-two-by-two
    arguments: [[[0, 2], [1, 3]]]
    expected: 3
    comparator: exact

  - name: example-single-cell
    arguments: [[[0]]]
    expected: 0
    comparator: exact

  - name: a-detour-avoids-a-tall-cell
    # Going down then right peaks at 2; going right first peaks at 9. The cost
    # is the maximum, so the detour is strictly better.
    arguments: [[[0, 9], [1, 2]]]
    expected: 2
    comparator: exact

  - name: the-start-is-not-the-lowest
    # The starting cell's own elevation is already 5, so nothing beats it.
    arguments: [[[5, 1], [2, 3]]]
    expected: 5
    comparator: exact

  - name: a-forced-tall-cell
    # The spiral route peaks at 4; no route avoids it.
    arguments: [[[0, 1, 2], [7, 8, 3], [6, 5, 4]]]
    expected: 4
    comparator: exact
    hidden: true

  - name: a-single-row
    arguments: [[[0]]]
    expected: 0
    comparator: exact
    hidden: true

  - name: three-by-three-with-a-wall
    # The route goes down the left, across the bottom, and peaks at 5.
    arguments: [[[0, 8, 7], [1, 2, 6], [4, 3, 5]]]
    expected: 5
    comparator: exact
    hidden: true

  - name: the-sum-would-be-much-larger
    # Down then right: max(0, 2, 1) is 2, while the sum along it is 3.
    arguments: [[[0, 3], [2, 1]]]
    expected: 2
    comparator: exact
    hidden: true

  - name: four-by-four
    # The snake along the top and down the right peaks at 6.
    arguments: [[[0, 1, 2, 3], [15, 14, 13, 4], [12, 11, 10, 5], [9, 8, 7, 6]]]
    expected: 6
    comparator: exact
    hidden: true
