# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-even-length
    arguments: [[1, 2, 3, 4]]
    expected: [1, 4, 2, 3]
    comparator: exact

  - name: example-odd-length
    # The middle element must end up last.
    arguments: [[1, 2, 3, 4, 5]]
    expected: [1, 5, 2, 4, 3]
    comparator: exact

  - name: empty-list
    arguments: [[]]
    expected: []
    comparator: exact

  - name: single-element
    arguments: [[9]]
    expected: [9]
    comparator: exact

  - name: two-elements-unchanged
    # Front then back is already the original order.
    arguments: [[1, 2]]
    expected: [1, 2]
    comparator: exact
    hidden: true

  - name: three-elements
    arguments: [[1, 2, 3]]
    expected: [1, 3, 2]
    comparator: exact
    hidden: true

  - name: six-elements
    arguments: [[1, 2, 3, 4, 5, 6]]
    expected: [1, 6, 2, 5, 3, 4]
    comparator: exact
    hidden: true

  - name: seven-elements
    # The odd case at a length where an off-by-one in the split is visible.
    arguments: [[10, 20, 30, 40, 50, 60, 70]]
    expected: [10, 70, 20, 60, 30, 50, 40]
    comparator: exact
    hidden: true
