# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-a-valid-split
    arguments: [[1, 5, 11, 5]]
    expected: true
    comparator: exact

  - name: example-odd-total
    arguments: [[1, 2, 3, 5]]
    expected: false
    comparator: exact

  - name: a-single-value
    # Neither group may be empty, and the total is odd anyway.
    arguments: [[1]]
    expected: false
    comparator: exact

  - name: each-value-can-be-used-only-once
    # The total is 4 and half is 2, but there is no 2 and no pair summing to
    # 2. Iterating the target upwards reuses the 1 and returns True.
    arguments: [[1, 3]]
    expected: false
    comparator: exact

  - name: two-equal-values
    arguments: [[4, 4]]
    expected: true
    comparator: exact
    hidden: true

  - name: two-unequal-values
    arguments: [[2, 6]]
    expected: false
    comparator: exact
    hidden: true

  - name: many-ones
    arguments: [[1, 1, 1, 1]]
    expected: true
    comparator: exact
    hidden: true

  - name: an-odd-count-of-equal-values
    # The total of 9 is odd.
    arguments: [[3, 3, 3]]
    expected: false
    comparator: exact
    hidden: true

  - name: an-even-total-that-still-cannot-split
    # The total is 12 and half is 6, but no subset reaches 6.
    arguments: [[1, 1, 10]]
    expected: false
    comparator: exact
    hidden: true

  - name: an-even-total-with-no-reachable-half
    # The total is 12 and half is 6, yet no subset of 2, 2, 3, 5 sums to 6. An
    # even total is necessary but not sufficient.
    arguments: [[2, 2, 3, 5]]
    expected: false
    comparator: exact
    hidden: true

  - name: a-larger-valid-split
    # The total is 28, and 7 + 6 + 1 reaches half.
    arguments: [[1, 2, 3, 4, 5, 6, 7]]
    expected: true
    comparator: exact
    hidden: true
