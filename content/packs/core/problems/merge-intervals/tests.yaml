# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-one-merge
    arguments: [[[1, 3], [2, 6], [8, 10]]]
    expected: [[1, 6], [8, 10]]
    comparator: exact

  - name: touching-intervals-merge
    arguments: [[[1, 4], [4, 5]]]
    expected: [[1, 5]]
    comparator: exact

  - name: empty-input
    arguments: [[]]
    expected: []
    comparator: exact

  - name: single-interval
    arguments: [[[3, 7]]]
    expected: [[3, 7]]
    comparator: exact

  - name: unsorted-input-must-be-ordered
    # The same intervals shuffled. A solution that scans without sorting
    # misses that [1, 3] and [2, 6] overlap.
    arguments: [[[8, 10], [1, 3], [2, 6]]]
    expected: [[1, 6], [8, 10]]
    comparator: exact

  - name: fully-contained-must-not-shrink-the-block
    # Assigning end instead of taking a max returns [[1, 5]].
    arguments: [[[1, 10], [2, 3], [4, 5]]]
    expected: [[1, 10]]
    comparator: exact
    hidden: true

  - name: no-overlaps-at-all
    arguments: [[[1, 2], [4, 5], [7, 8]]]
    expected: [[1, 2], [4, 5], [7, 8]]
    comparator: exact
    hidden: true

  - name: everything-collapses-to-one
    arguments: [[[1, 5], [2, 6], [3, 7], [4, 8]]]
    expected: [[1, 8]]
    comparator: exact
    hidden: true

  - name: zero-width-intervals
    # start == end is legal and two identical points merge to one.
    arguments: [[[1, 1], [1, 1], [3, 3]]]
    expected: [[1, 1], [3, 3]]
    comparator: exact
    hidden: true

  - name: negatives-and-a-shared-start
    # Equal starts must not be treated as a gap.
    arguments: [[[-5, -1], [-5, 2], [3, 4]]]
    expected: [[-5, 2], [3, 4]]
    comparator: exact
    hidden: true
