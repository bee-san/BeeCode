# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-mixed-signs
    arguments: [[-1, 0, 1, 2, -1, -4]]
    expected: [[-1, -1, 2], [-1, 0, 1]]
    comparator: unordered_list

  - name: empty-list
    arguments: [[]]
    expected: []
    comparator: unordered_list

  - name: too-short
    arguments: [[0, 0]]
    expected: []
    comparator: unordered_list

  - name: no-triplet-sums-to-zero
    arguments: [[1, 2, 3]]
    expected: []
    comparator: unordered_list

  - name: four-zeros-are-one-triplet
    # The classic inner-deduplication failure reports this twice.
    arguments: [[0, 0, 0, 0]]
    expected: [[0, 0, 0]]
    comparator: unordered_list
    hidden: true

  - name: three-distinct-triplets
    arguments: [[3, 0, -2, -1, 1, 2]]
    expected: [[-2, -1, 3], [-2, 0, 2], [-1, 0, 1]]
    comparator: unordered_list
    hidden: true

  - name: duplicate-pair-with-a-partner
    # Uses both 1s in one triplet, which is legal, without duplicating the
    # other.
    arguments: [[-2, 0, 1, 1, 2]]
    expected: [[-2, 0, 2], [-2, 1, 1]]
    comparator: unordered_list
    hidden: true

  - name: smallest-value-repeats-at-the-end
    # After sorting, index -1 holds 1. Omitting the first > 0 guard on the
    # outer skip loses this triplet entirely.
    arguments: [[1, 1, -2]]
    expected: [[-2, 1, 1]]
    comparator: unordered_list
    hidden: true
