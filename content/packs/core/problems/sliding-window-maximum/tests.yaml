# The official suite. Passing every test here is what "passed" means, and only an
# unaided pass counts as solved.

tests:
  - name: example-window-three
    arguments: [[1, 3, -1, -3, 5, 3, 6, 7], 3]
    expected: [3, 3, 5, 5, 6, 7]
    comparator: exact

  - name: window-of-one-is-the-input
    arguments: [[4, 2], 1]
    expected: [4, 2]
    comparator: exact

  - name: window-covers-everything
    # Exactly one window, so exactly one answer.
    arguments: [[2, 9, 4], 3]
    expected: [9]
    comparator: exact

  - name: strictly-decreasing
    # The front expires every step; nothing is ever popped from the back.
    arguments: [[5, 4, 3, 2], 2]
    expected: [5, 4, 3]
    comparator: exact

  - name: strictly-increasing
    # The mirror case: every new value clears the whole deque.
    arguments: [[1, 2, 3, 4], 2]
    expected: [2, 3, 4]
    comparator: exact

  - name: all-equal
    # Popping the back on <= keeps the deque at size one here.
    arguments: [[7, 7, 7, 7], 2]
    expected: [7, 7, 7]
    comparator: exact
    hidden: true

  - name: maximum-expires-and-a-standby-takes-over
    # The 9 leaves the window after one step, so the answer must fall back to
    # a value that was never the running maximum.
    arguments: [[9, 1, 2, 3], 2]
    expected: [9, 2, 3]
    comparator: exact
    hidden: true

  - name: all-negative
    # A running maximum initialised to 0 fails every entry.
    arguments: [[-5, -2, -8, -1], 2]
    expected: [-2, -2, -1]
    comparator: exact
    hidden: true

  - name: single-element
    arguments: [[42], 1]
    expected: [42]
    comparator: exact
    hidden: true

